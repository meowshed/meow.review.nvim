name: Release

# Publishes each vX.Y.Z tag to luarocks.org (ADR-0010). `check` also runs on
# every pull request, so a rockspec change that drops plugin/ fails before it
# is merged.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

jobs:
  check:
    name: Check the rock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install LuaRocks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luarocks

      - name: Check the installed rock ships plugin/meow-review.lua
        run: scripts/check-rock.sh

      # Only a tag has a version to search for.
      - name: Refuse a version already on luarocks.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-unpublished.sh "${GITHUB_REF_NAME#v}"

  publish:
    name: Publish to luarocks.org
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to a commit, because a tag can be moved and a commit can't
      # (ADR-0010); Dependabot proposes moving the pin.
      - name: Publish the rock
        uses: lumen-oss/luarocks-tag-release@4aa641e8e4befe0617fa3d7db40dbda832ddd27b # v7.3.0
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          template: meow.review.nvim-scm-1.rockspec
          fail_on_duplicate: true
