name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Tests (nvim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim:
          - stable
          - nightly

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim (${{ matrix.nvim }})
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LuaRocks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luarocks

      - name: Install test dependencies (busted + nlua for Lua 5.1)
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: installing busted + nlua"
            luarocks --lua-version 5.1 --local install busted \
              && luarocks --lua-version 5.1 --local install nlua \
              && break
            echo "Install failed, waiting 30s before retry..."
            sleep 30
          done
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"

      - name: Cache nui.nvim dep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/
          key: deps-nui-${{ hashFiles('tests/busted_helper.lua') }}

      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: make lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stylua
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ plugin/ tests/ scripts/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lua-language-server
        run: |
          mkdir -p "$HOME/luals"
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.18.2/lua-language-server-3.18.2-linux-x64.tar.gz \
            | tar -xz -C "$HOME/luals"
          echo "$HOME/luals/bin" >> "$GITHUB_PATH"

      - name: Run lua-language-server
        run: make check

  build:
    name: Build rock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LuaRocks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luarocks

      - name: Build the scm rockspec
        run: make build
